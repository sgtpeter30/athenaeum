@if(dataSource.length !== 0){
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
    <mat-radio-group [(ngModel)]="selectedSource" (change)="selectDataSource()">
      @for (column of columns; track $index) {
        <ng-container [matColumnDef]="column.columnDef" [sticky]="isSticky(column.columnDef)">
          <th mat-header-cell *matHeaderCellDef>
            {{column.header}}
          </th>

          <td mat-cell *matCellDef="let row">
            @if (column.columnDef !== 'selected') {
              {{column.cell(row)}}
            }
            @if (column.columnDef === 'selected') {
              <mat-radio-button [value]="row"></mat-radio-button>
            }
          </td>
        </ng-container>
      }
    </mat-radio-group>
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
@else {
  <mat-spinner></mat-spinner>
}
