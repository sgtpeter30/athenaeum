<mat-form-field subscriptSizing="dynamic">
  <mat-label>{{control.label}}</mat-label>
  <input matInput [field]="field" type="text">
  <mat-error>{{getErrorMessage()}}</mat-error>
</mat-form-field>

<button type="button" mat-fab color="primary" (click)="getISBN()">
  <mat-icon>photo_camera</mat-icon>
</button>

<button type="button" mat-fab color="primary" (click)="findByISBN()">
  <mat-icon>cloud_download</mat-icon>
</button>

<dialog #dialog>
  <video #isbn_video autoplay></video>
</dialog>
